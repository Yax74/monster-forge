name: Build release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, such as v1.4.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests and validate metadata
        run: npm run check

      - name: Validate release tag and repository URLs
        run: node tools/validate-release.mjs "$RELEASE_TAG" "$GITHUB_REPOSITORY"

      - name: Build Foundry release assets
        run: |
          mkdir -p dist/package
          cp module.json README.md CHANGELOG.md LICENSE dist/package/
          cp -R docs scripts styles templates dist/package/
          cp module.json dist/module.json
          (cd dist/package && zip -q -r ../monster-forge.zip .)
          (cd dist && sha256sum monster-forge.zip > monster-forge.zip.sha256)

      - name: Attach assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$RELEASE_TAG"
          dist/module.json
          dist/monster-forge.zip
          dist/monster-forge.zip.sha256
          --clobber
